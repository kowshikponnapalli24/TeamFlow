
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: teamflow-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in root .env}
      CLIENT_URL: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - ./server/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: teamflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
